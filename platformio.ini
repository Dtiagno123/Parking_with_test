; =====================================================================
;  Parking ESP32 — configuration PlatformIO
;  Un « environnement » par programme. Chacun choisit ses fichiers
;  avec build_src_filter, car un programme ESP32 ne peut avoir
;  qu'une seule fonction setup() et une seule loop().
; =====================================================================

[platformio]
; Environnement compilé quand on tape simplement « pio run »
default_envs = essai_signalisation

; ---------------------------------------------------------------------
;  Section commune : héritée par tous les environnements [env:xxx]
; ---------------------------------------------------------------------
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Avertissements activés uniquement sur NOTRE code (dossier src/),
; pas sur le framework Arduino : sinon on serait noyé sous des
; avertissements qui ne nous concernent pas.
build_src_flags = -Wall -Wextra

; Bibliothèques : on n'en ajoute une qu'au moment où un module en a besoin
;   fichier 5 (ecran)    : adafruit/Adafruit SSD1306, adafruit/Adafruit GFX Library
;   fichier 8 (barriere) : madhephaestus/ESP32Servo
lib_deps =

; ---------------------------------------------------------------------
;  Programmes d'essai : tous les modules + UN SEUL fichier de essais/,
;  sans main.cpp.
;  Les filtres s'appliquent dans l'ordre, de gauche à droite :
;    +<*>                          on prend tout src/
;    -<main.cpp>                   on retire le programme final
;    -<essais/>                    on retire tous les essais...
;    +<essais/essai_demarrage.cpp> ...puis on remet uniquement celui-ci
; ---------------------------------------------------------------------
[env:essai_signalisation]
build_src_filter = +<journal.cpp> +<signalisation.cpp>
  +<essais/essai_signalisation.cpp>

; À ajouter plus tard :
;   [env:native]  -> tests de l'automate sur le PC  (fichier 10)
;   [env:parking] -> +<*> -<essais/>                 (fichier 12)